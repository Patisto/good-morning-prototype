services:
  - type: web
    name: good-morning-api-staging
    runtime: node
    plan: starter
    branch: staging
    rootDir: good-morning-backend
    buildCommand: npm ci && npm run build
    preDeployCommand: node dist/db/migrate.js
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYCHANGU_ENV
        value: test
      - key: PAYCHANGU_BASE_URL
        value: https://api.paychangu.com
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYCHANGU_WEBHOOK_SECRET
        sync: false
      - key: PAYCHANGU_CALLBACK_URL
        sync: false
      - key: PAYCHANGU_RETURN_URL
        sync: false
      - key: LOOKUP_TOKEN_SECRET
        generateValue: true
