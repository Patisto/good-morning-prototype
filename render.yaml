services:
  - type: web
    name: good-morning-api
    runtime: node
    rootDir: good-morning-backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PAYCHANGU_ENV
        value: test
      - key: PAYCHANGU_BASE_URL
        value: https://api.paychangu.com
      - key: PAYCHANGU_SECRET_KEY
        sync: false
      - key: PAYCHANGU_WEBHOOK_SECRET
        sync: false
      - key: PAYCHANGU_CALLBACK_URL
        sync: false
      - key: PAYCHANGU_RETURN_URL
        sync: false
      - key: PAYMENT_CURRENCY
        value: MWK
      - key: ALLOW_PARTIAL_PAYMENTS
        value: "true"
      - key: MIN_PAYMENT_AMOUNT
        value: "0"
      - key: ALLOW_OVERPAYMENT
        value: "false"
      - key: LOOKUP_TOKEN_SECRET
        generateValue: true
      - key: LOOKUP_TOKEN_TTL_SECONDS
        value: "600"
      - key: PAYMENT_PENDING_EXPIRY_MINUTES
        value: "60"
      - key: RECONCILE_INTERVAL_MINUTES
        value: "10"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
