
name: Build and deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'good-morning-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: good-morning-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: good-morning-backend/package-lock.json

      - name: Install and build on GitHub
        working-directory: good-morning-backend
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Package compiled API and production dependencies
        run: |
          set -eu

          mkdir -p release
          cp -a good-morning-backend/dist release/
          cp good-morning-backend/package.json release/
          cp good-morning-backend/package-lock.json release/
          cp -a good-morning-backend/node_modules release/
          cp good-morning-backend/ecosystem.config.cjs release/

          mkdir -p release/ops
          cp good-morning-backend/ops/deploy.cjs release/ops/

          tar -czf good-morning-api.tar.gz -C release .

      - name: Configure SSH
        env:
          VPS_SSH_KEY_B64: ${{ vars.VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          set -eu

          install -m 700 -d "$HOME/.ssh"

          test -n "$VPS_SSH_KEY_B64" || {
            echo "ERROR: Missing Actions variable VPS_SSH_KEY_B64"
            exit 1
          }

          # Decode the Base64-encoded private key.
          if ! printf '%s' "$VPS_SSH_KEY_B64" \
            | base64 --decode > "$HOME/.ssh/id_ed25519"; then
            echo "ERROR: VPS_SSH_KEY_B64 is not valid Base64"
            exit 1
          fi

          chmod 600 "$HOME/.ssh/id_ed25519"

          # Validate the decoded private key.
          if ! ssh-keygen -y -P '' \
            -f "$HOME/.ssh/id_ed25519" > /dev/null; then
            echo "ERROR: Decoded SSH private key is invalid or encrypted"
            exit 1
          fi

          test -n "$VPS_KNOWN_HOSTS" || {
            echo "ERROR: Missing Actions variable VPS_KNOWN_HOSTS"
            exit 1
          }

          printf '%s\n' "$VPS_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -eu

          test -n "$VPS_HOST" || {
            echo "ERROR: Missing Actions variable VPS_HOST"
            exit 1
          }

          test -n "$VPS_USER" || {
            echo "ERROR: Missing Actions variable VPS_USER"
            exit 1
          }

          VPS_PORT="${VPS_PORT:-22}"

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'echo "SSH authentication successful"'

      - name: Copy release to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT }}
        run: |
          set -eu

          VPS_PORT="${VPS_PORT:-22}"
          RELEASE="/srv/good-morning/releases/${GITHUB_SHA}"
          ARCHIVE="/tmp/good-morning-${GITHUB_SHA}.tar.gz"

          test -n "$VPS_HOST" || {
            echo "ERROR: Missing Actions variable VPS_HOST"
            exit 1
          }

          test -n "$VPS_USER" || {
            echo "ERROR: Missing Actions variable VPS_USER"
            exit 1
          }

          # Upload the release archive.
          scp \
            -i "$HOME/.ssh/id_ed25519" \
            -P "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            good-morning-api.tar.gz \
            "$VPS_USER@$VPS_HOST:$ARCHIVE"

          # Prepare the release directory.
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "sudo mkdir -p '$RELEASE'
             sudo chown -R '$VPS_USER:$VPS_USER' '$RELEASE'"

          # Extract and execute the deployment script.
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "set -eu
             if sudo pm2 describe good-morning-api >/dev/null 2>&1; then
               sudo pm2 delete good-morning-api
               sudo pm2 save
             fi
             tar -xzf '$ARCHIVE' -C '$RELEASE'
             rm -f '$ARCHIVE'
             node '$RELEASE/ops/deploy.cjs' '$RELEASE'"
