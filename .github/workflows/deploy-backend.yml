name: Build and deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'good-morning-backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: good-morning-backend-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: good-morning-backend/package-lock.json
      - name: Install and build on GitHub
        working-directory: good-morning-backend
        run: |
          npm ci
          npm run build
          npm prune --omit=dev
      - name: Package compiled API and production dependencies
        run: |
          mkdir -p release
          cp -a good-morning-backend/dist release/
          cp good-morning-backend/package.json good-morning-backend/package-lock.json release/
          cp -a good-morning-backend/node_modules release/
          cp good-morning-backend/ecosystem.config.cjs release/
          mkdir -p release/ops
          cp good-morning-backend/ops/deploy.cjs release/ops/
          tar -czf good-morning-api.tar.gz -C release .
      - name: Configure SSH
        env:
          VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy release to VPS
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PORT: ${{ vars.VPS_SSH_PORT }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER"
          VPS_SSH_PORT="${VPS_SSH_PORT:-22}"
          scp -P "$VPS_SSH_PORT" good-morning-api.tar.gz "$VPS_USER@$VPS_HOST:/tmp/good-morning-${GITHUB_SHA}.tar.gz"
          ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p /srv/good-morning/releases/${GITHUB_SHA}"
          ssh -p "$VPS_SSH_PORT" "$VPS_USER@$VPS_HOST" "tar -xzf /tmp/good-morning-${GITHUB_SHA}.tar.gz -C /srv/good-morning/releases/${GITHUB_SHA} && rm /tmp/good-morning-${GITHUB_SHA}.tar.gz && node /srv/good-morning/releases/${GITHUB_SHA}/ops/deploy.cjs /srv/good-morning/releases/${GITHUB_SHA}"
