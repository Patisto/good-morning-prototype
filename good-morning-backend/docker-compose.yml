services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: good_morning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Keep this development database separate from any PostgreSQL instance
      # already using the default host port.
      - '5433:5432'
    volumes:
      - good_morning_dev_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/good_morning
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: 12h
      PORT: 4000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SEED_SUPER_EMAIL: ${SEED_SUPER_EMAIL:?Set SEED_SUPER_EMAIL in .env}
      SEED_SUPER_PASSWORD: ${SEED_SUPER_PASSWORD:?Set SEED_SUPER_PASSWORD in .env}
      SEED_SUPER_NAME: ${SEED_SUPER_NAME:-Super Manager}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PAYCHANGU_ENV: ${PAYCHANGU_ENV:-test}
      PAYCHANGU_BASE_URL: ${PAYCHANGU_BASE_URL:-https://api.paychangu.com}
      PAYCHANGU_PUBLIC_KEY: ${PAYCHANGU_PUBLIC_KEY:-}
      PAYCHANGU_SECRET_KEY: ${PAYCHANGU_SECRET_KEY:-}
      PAYCHANGU_WEBHOOK_SECRET: ${PAYCHANGU_WEBHOOK_SECRET:-}
      PAYCHANGU_CALLBACK_URL: ${PAYCHANGU_CALLBACK_URL:-}
      PAYCHANGU_RETURN_URL: ${PAYCHANGU_RETURN_URL:-}
      LOOKUP_TOKEN_SECRET: ${LOOKUP_TOKEN_SECRET:-}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-MWK}
      ALLOW_PARTIAL_PAYMENTS: ${ALLOW_PARTIAL_PAYMENTS:-true}
      MIN_PAYMENT_AMOUNT: ${MIN_PAYMENT_AMOUNT:-0}
      ALLOW_OVERPAYMENT: ${ALLOW_OVERPAYMENT:-false}
      RATE_LIMIT_INITIATE_PER_MINUTE: ${RATE_LIMIT_INITIATE_PER_MINUTE:-20}
      RATE_LIMIT_STATUS_PER_MINUTE: ${RATE_LIMIT_STATUS_PER_MINUTE:-60}
    ports:
      - '4000:4000'

volumes:
  good_morning_dev_db_data:
